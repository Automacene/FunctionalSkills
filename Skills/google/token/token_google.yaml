apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: token_google
  labels:
    automacene.org/category: google
    automacene.org/skill: token
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Google Access Token
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: A fresh Google OAuth access token, refreshed from a refresh token when the cached one is close to expiring.
  runtime: python:3.11
  handler: token_google:handler
  minReplicas: 1
  maxReplicas: 1
  env:
  - name: GOOGLE_CLIENT_ID
    value: ''
  - name: GOOGLE_CLIENT_SECRET
    value: ''
  - name: GOOGLE_REFRESH_TOKEN
    value: ''
  build:
    commands:
    - pip install requests
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs: []
  output:
  - name: token
    type: string
    description: The access token.
  - name: expiresAt
    type: integer
    description: When it expires, in epoch seconds.
