apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: extract_emails_html
  labels:
    automacene.org/category: html
    automacene.org/skill: extract_emails
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Extract Emails
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: Every email address found in a block of HTML or text, in order.
  runtime: python:3.11
  handler: extract_emails_html:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: html
    type: string
    description: The HTML or text.
    required: true
  output:
  - name: emails
    type: array
    description: The addresses, as found.
  examples:
  - input:
      html: <a href='mailto:jo@ex.com'>jo@ex.com</a>
    output:
      emails:
      - jo@ex.com
      - jo@ex.com
