apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: eval_builtins
  labels:
    automacene.org/category: builtins
    automacene.org/skill: eval
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Evaluate Built-ins
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: 'Evaluate an expression of the old DAEGON data built-ins in one call. A call is an object with one key that
    starts with "$" and the list of its arguments, such as {"$concat": ["a", {"$first": [[1, 2]]}]}; anything else is data. Text: encode, decode, str,
    concat, nl, replace, split, sanitize, slug, to_jsons, from_jsons, extract_emails, extract_phones. Lists: list, first,
    last, nth (index_of), len, range, dupe, dedupe, flatten, vslice, find_by, zip, keyed_zip, enrich_with_fields, merge_on,
    cartesian_with, cartesian_map, op_on, include, exclude, exclude_on_fields. Objects: get, gets, set, sets, has_any_value,
    all_empty. Numbers: min, max, sum, multiply. Logic: eq, ne, gt, gte, lt, lte, contains, is_empty, is_null, not, and, or.'
  runtime: python:3.11
  handler: eval_builtins:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: expr
    type: object
    description: One expression, of any type. Give this, fields, or both.
    required: false
  - name: fields
    type: object
    description: Named expressions, each evaluated on its own.
    required: false
  output:
  - name: value
    type: object
    description: The value of expr, of any type, when expr was given.
  - name: fields
    type: object
    description: The value of each named expression, when fields was given.
  examples:
  - input:
      expr:
        $concat:
        - '<DETAILS>'
        - $get:
          - $first:
            - - documentName: a.pdf
              - documentName: b.pdf
          - documentName
    output:
      value: <DETAILS>a.pdf
  - input:
      fields:
        names:
          $vslice:
          - - name: Ada
            - name: Grace
          - name
        count:
          $len:
          - - 1
            - 2
            - 3
    output:
      fields:
        names:
        - Ada
        - Grace
        count: 3
  - input:
      expr:
        $op_on:
        - encode
        - - a
          - b
    output:
      value:
      - YQ==
      - Yg==
  - input:
      expr:
        $exclude:
        - is_empty
        - - x
          - ''
          - y
    output:
      value:
      - x
      - y
  - input:
      expr:
        literal: data
        nested:
          $nl: []
    output:
      value:
        literal: data
        nested: "\n"
  - input:
      expr:
        $nope: []
    status: 400
  - input:
      expr:
        $first: x
    status: 400
  - input: {}
    status: 400
