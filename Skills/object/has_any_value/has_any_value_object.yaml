apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: has_any_value_object
  labels:
    automacene.org/category: object
    automacene.org/skill: has_any_value
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Has Any Value
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: 'Whether any of an object''s values is filled: truthy, and not an empty string or object.'
  runtime: python:3.11
  handler: has_any_value_object:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: object
    type: object
    description: The object.
    required: true
  output:
  - name: result
    type: boolean
    description: True when at least one value is filled.
  examples:
  - input:
      object:
        a: ''
        b: null
        c: 0
    output:
      result: false
  - input:
      object:
        a: ''
        b: x
    output:
      result: true
