apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: sets_object
  labels:
    automacene.org/category: object
    automacene.org/skill: sets
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Set Fields
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: A copy of an object with several keys set.
  runtime: python:3.11
  handler: sets_object:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: object
    type: object
    description: The object.
    required: true
  - name: values
    type: object
    description: The keys and values to set.
    required: true
  output:
  - name: object
    type: object
    description: The changed copy.
  examples:
  - input:
      object:
        a: 1
      values:
        a: 0
        b: 2
    output:
      object:
        a: 0
        b: 2
