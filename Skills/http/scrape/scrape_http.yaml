apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: scrape_http
  labels:
    automacene.org/category: http
    automacene.org/skill: scrape
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Scrape Page Text
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: Fetch a web page and return its visible text, scripts and styles removed, up to a length.
  runtime: python:3.11
  handler: scrape_http:handler
  minReplicas: 1
  maxReplicas: 1
  build:
    commands:
    - pip install requests beautifulsoup4
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: url
    type: string
    description: The page.
    required: true
  - name: timeoutSeconds
    type: number
    description: How long to wait.
    default: 10
  - name: maxChars
    type: integer
    description: The most text returned.
    default: 5000
  output:
  - name: text
    type: string
    description: The page's text; empty when the page could not be fetched.
  - name: error
    type: string
    description: Why the page could not be fetched, when it could not.
  examples:
  - input: {}
    status: 400
