apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: fan_out_http
  labels:
    automacene.org/category: http
    automacene.org/skill: fan_out
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: HTTP Fan Out
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: Call one HTTP endpoint once per item and return the replies in item order.
  runtime: python:3.11
  handler: fan_out_http:handler
  minReplicas: 1
  maxReplicas: 1
  build:
    commands:
    - pip install requests
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: url
    type: string
    description: The endpoint.
    required: true
  - name: items
    type: array
    description: One call per item; an object is merged over params, anything else is sent as item.
    required: true
  - name: method
    type: string
    description: GET sends the fields as the query; anything else as a JSON body.
    default: POST
  - name: headers
    type: object
    description: Sent with every call.
    default: {}
  - name: params
    type: object
    description: Fields sent with every item.
    default: {}
  - name: delayMs
    type: number
    description: Pause between calls.
    default: 0
  - name: timeoutSeconds
    type: number
    description: Per call.
    default: 30
  output:
  - name: results
    type: array
    description: Each reply's JSON (or {text} for a reply that is not JSON), in item order.
  examples:
  - input:
      items:
      - 1
    status: 400
