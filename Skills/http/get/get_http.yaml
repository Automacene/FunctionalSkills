apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: get_http
  labels:
    automacene.org/category: http
    automacene.org/skill: get
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: HTTP GET
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: Fetch a URL and return its body as text.
  runtime: python:3.11
  handler: get_http:handler
  minReplicas: 1
  maxReplicas: 1
  build:
    commands:
    - pip install requests
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: url
    type: string
    description: What to fetch.
    required: true
  - name: timeoutSeconds
    type: number
    description: How long to wait.
    default: 10
  output:
  - name: text
    type: string
    description: The response body.
  - name: status
    type: integer
    description: The response's HTTP status.
  examples:
  - input: {}
    status: 400
