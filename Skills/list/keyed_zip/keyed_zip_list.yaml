apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: keyed_zip_list
  labels:
    automacene.org/category: list
    automacene.org/skill: keyed_zip
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Keyed Zip
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: Like zip, with each position's object wrapped under its own outer key.
  runtime: python:3.11
  handler: keyed_zip_list:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: outer_keys
    type: array
    description: A key per position.
    required: true
  - name: inner_keys
    type: array
    description: A key per list; missing ones become field_<n>.
    required: true
  - name: lists
    type: array
    description: The lists, all read by position; the first decides the length.
    required: true
  output:
  - name: items
    type: array
    description: 'One {outer_key: {inner_key: value}} per position.'
  examples:
  - input:
      outer_keys:
      - x
      - y
      inner_keys:
      - v
      lists:
      - - 1
        - 2
    output:
      items:
      - x:
          v: 1
      - y:
          v: 2
