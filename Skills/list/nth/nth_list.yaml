apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: nth_list
  labels:
    automacene.org/category: list
    automacene.org/skill: nth
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Nth Item
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: The item at an index, or null when the index is outside the list.
  runtime: python:3.11
  handler: nth_list:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: items
    type: array
    description: The list.
    required: true
  - name: index
    type: integer
    description: Zero-based.
    required: true
  output:
  - name: item
    type: object
    description: The item (any type), or null.
  examples:
  - input:
      items:
      - a
      - b
      index: 1
    output:
      item: b
  - input:
      items:
      - a
      index: 5
    output:
      item: null
