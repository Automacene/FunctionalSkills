apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: vslice_list
  labels:
    automacene.org/category: list
    automacene.org/skill: vslice
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Pluck
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: One key's value from every object in a list (null for items without it).
  runtime: python:3.11
  handler: vslice_list:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: items
    type: array
    description: The objects.
    required: true
  - name: key
    type: string
    description: The key to take.
    required: true
  output:
  - name: values
    type: array
    description: The values, in order.
  examples:
  - input:
      items:
      - n: 1
      - n: 2
      - {}
      key: n
    output:
      values:
      - 1
      - 2
      - null
