apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: first_list
  labels:
    automacene.org/category: list
    automacene.org/skill: first
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: First Item
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: The first item of a list, or null for an empty one.
  runtime: python:3.11
  handler: first_list:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: items
    type: array
    description: The list.
    required: true
  output:
  - name: item
    type: object
    description: The first item (any type), or null.
  examples:
  - input:
      items:
      - 1
      - 2
      - 3
    output:
      item: 1
  - input:
      items: []
    output:
      item: null
