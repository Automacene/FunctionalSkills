apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: exclude_on_fields_list
  labels:
    automacene.org/category: list
    automacene.org/skill: exclude_on_fields
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Exclude On Field
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: Drop the objects whose field a predicate holds for.
  runtime: python:3.11
  handler: exclude_on_fields_list:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: predicate
    type: string
    description: eq, ne, gt, gte, lt, lte, contains, is_empty, is_null or not.
    required: true
  - name: items
    type: array
    description: The objects.
    required: true
  - name: field
    type: string
    description: The field the predicate is applied to.
    required: true
  - name: args
    type: array
    description: Arguments after the item, e.g. [5] for gt 5.
    default: []
  output:
  - name: items
    type: array
    description: The objects kept.
  examples:
  - input:
      predicate: is_empty
      items:
      - e: a@b.c
      - e: ''
      - {}
      field: e
    output:
      items:
      - e: a@b.c
