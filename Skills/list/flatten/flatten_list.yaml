apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: flatten_list
  labels:
    automacene.org/category: list
    automacene.org/skill: flatten
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Flatten
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: 'Flatten a list one level: lists inside it are spliced in, other items kept.'
  runtime: python:3.11
  handler: flatten_list:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: items
    type: array
    description: The list.
    required: true
  output:
  - name: items
    type: array
    description: The flattened list.
  examples:
  - input:
      items:
      - - 1
        - 2
      - 3
      - - 4
    output:
      items:
      - 1
      - 2
      - 3
      - 4
