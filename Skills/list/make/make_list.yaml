apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: make_list
  labels:
    automacene.org/category: list
    automacene.org/skill: make
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Make List
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: A list of the values given.
  runtime: python:3.11
  handler: make_list:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: values
    type: array
    description: The values.
    default: []
  output:
  - name: items
    type: array
    description: The list.
  examples:
  - input:
      values:
      - 1
      - a
    output:
      items:
      - 1
      - a
