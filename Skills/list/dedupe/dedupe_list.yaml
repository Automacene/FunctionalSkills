apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: dedupe_list
  labels:
    automacene.org/category: list
    automacene.org/skill: dedupe
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Dedupe
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: Remove repeated items, keeping the first of each in order.
  runtime: python:3.11
  handler: dedupe_list:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: items
    type: array
    description: The list.
    required: true
  output:
  - name: items
    type: array
    description: The list without repeats.
  examples:
  - input:
      items:
      - 1
      - 2
      - 1
      - 3
      - 2
    output:
      items:
      - 1
      - 2
      - 3
  - input:
      items:
      - a: 1
      - a: 1
    output:
      items:
      - a: 1
