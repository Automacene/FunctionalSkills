apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: dedupe_vals_list
  labels:
    automacene.org/category: list
    automacene.org/skill: dedupe_vals
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Unique Values
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: The distinct values of a list, sorted.
  runtime: python:3.11
  handler: dedupe_vals_list:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: items
    type: array
    description: The list.
    required: true
  output:
  - name: items
    type: array
    description: Each distinct value once, sorted when the values can be compared.
  examples:
  - input:
      items:
      - 3
      - 1
      - 3
      - 2
    output:
      items:
      - 1
      - 2
      - 3
