apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: length_list
  labels:
    automacene.org/category: list
    automacene.org/skill: length
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Length
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: How many items a list has (or characters a string has).
  runtime: python:3.11
  handler: length_list:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: items
    type: array
    description: The list, or a string.
    required: true
  output:
  - name: length
    type: integer
    description: The count.
  examples:
  - input:
      items:
      - 1
      - 2
      - 3
    output:
      length: 3
  - input:
      items: abcd
    output:
      length: 4
