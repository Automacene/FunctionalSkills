apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: dupe_list
  labels:
    automacene.org/category: list
    automacene.org/skill: dupe
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Repeat
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: A list holding one value repeated a number of times.
  runtime: python:3.11
  handler: dupe_list:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: value
    type: object
    description: The value to repeat, of any type.
    required: true
  - name: times
    type: integer
    description: How many copies.
    required: true
  output:
  - name: items
    type: array
    description: The copies.
  examples:
  - input:
      value: x
      times: 3
    output:
      items:
      - x
      - x
      - x
