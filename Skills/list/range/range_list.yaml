apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: range_list
  labels:
    automacene.org/category: list
    automacene.org/skill: range
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Range
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: The integers from start up to, not including, end.
  runtime: python:3.11
  handler: range_list:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: start
    type: integer
    description: The first integer.
    required: true
  - name: end
    type: integer
    description: One past the last integer.
    required: true
  output:
  - name: items
    type: array
    description: The integers.
  examples:
  - input:
      start: 2
      end: 5
    output:
      items:
      - 2
      - 3
      - 4
