apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: op_on_list
  labels:
    automacene.org/category: list
    automacene.org/skill: op_on
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Apply Function
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: Call a nuclio function once per item and return its replies in order (null where a call failed).
  runtime: python:3.11
  handler: op_on_list:handler
  minReplicas: 1
  maxReplicas: 1
  build:
    commands:
    - pip install requests
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: function
    type: string
    description: The nuclio function to call, by name.
    required: true
  - name: items
    type: array
    description: One call per item.
    required: true
  - name: field
    type: string
    description: The input each item is sent as; an object item with no field is merged over params instead.
  - name: params
    type: object
    description: Inputs sent with every item.
    default: {}
  - name: timeoutSeconds
    type: number
    description: Per call.
    default: 30
  output:
  - name: results
    type: array
    description: Each call's JSON reply, or null where it failed.
  - name: errors
    type: array
    description: For each failed call, its index and why.
  examples:
  - input:
      items:
      - 1
    status: 400
