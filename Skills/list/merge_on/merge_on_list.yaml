apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: merge_on_list
  labels:
    automacene.org/category: list
    automacene.org/skill: merge_on
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Merge By Name
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: 'Merge objects sharing a name: the listed keys collect every distinct non-empty value, the rest keep the last.'
  runtime: python:3.11
  handler: merge_on_list:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: items
    type: array
    description: The objects; ones without a name are dropped.
    required: true
  - name: keep_as_list
    type: array
    description: Keys whose values are collected into lists.
    required: true
  output:
  - name: items
    type: array
    description: One object per name, in first-seen order.
  examples:
  - input:
      items:
      - name: a
        email: x
        role: '1'
      - name: a
        email:
        - y
        - x
        role: '2'
      keep_as_list:
      - email
    output:
      items:
      - name: a
        email:
        - x
        - y
        role: '2'
