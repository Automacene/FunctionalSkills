apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: find_by_list
  labels:
    automacene.org/category: list
    automacene.org/skill: find_by
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Find By
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: The first object in a list whose key equals a value, or null.
  runtime: python:3.11
  handler: find_by_list:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: items
    type: array
    description: The objects.
    required: true
  - name: key
    type: string
    description: The key to compare.
    required: true
  - name: value
    type: object
    description: The value it must equal, of any type.
    required: true
  output:
  - name: item
    type: object
    description: The first match, or null.
  examples:
  - input:
      items:
      - id: 1
      - id: 2
        x: y
      key: id
      value: 2
    output:
      item:
        id: 2
        x: y
