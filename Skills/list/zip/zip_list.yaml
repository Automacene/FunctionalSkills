apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: zip_list
  labels:
    automacene.org/category: list
    automacene.org/skill: zip
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Zip
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: Turn parallel lists into one object per position, keyed by the given keys.
  runtime: python:3.11
  handler: zip_list:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: keys
    type: array
    description: A key per list; missing ones become field_<n>.
    required: true
  - name: lists
    type: array
    description: The lists, all read by position; the first decides the length.
    required: true
  output:
  - name: items
    type: array
    description: One object per position.
  examples:
  - input:
      keys:
      - name
      - age
      lists:
      - - a
        - b
      - - 1
    output:
      items:
      - name: a
        age: 1
      - name: b
        age: null
