apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: fan_out_daegon
  labels:
    automacene.org/category: daegon
    automacene.org/skill: fan_out
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: DAEGON Fan Out
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: Send one request per item to a DAEGON service over Kafka and return the replies in item order.
  runtime: python:3.11
  handler: fan_out_daegon:handler
  minReplicas: 1
  maxReplicas: 1
  env:
  - name: BOOTSTRAP_SERVERS
    value: broker:9092
  - name: SCHEMA_REGISTRY
    value: http://schema_registry:8081
  build:
    commands:
    - pip install confluent-kafka[json,schemaregistry]
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: topic
    type: string
    description: The service's request topic.
    required: true
  - name: replyTopic
    type: string
    description: The service's response topic.
    required: true
  - name: target
    type: string
    description: The service's name, which it filters requests by.
    required: true
  - name: items
    type: array
    description: One request per item; an object is merged over params, anything else is sent as item.
    required: true
  - name: params
    type: object
    description: Fields sent with every item.
    default: {}
  - name: delayMs
    type: number
    description: Pause between requests.
    default: 0
  - name: timeoutSeconds
    type: number
    description: How long to wait for all replies.
    default: 120
  output:
  - name: results
    type: array
    description: Each reply message, in item order (null where none came).
