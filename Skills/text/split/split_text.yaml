apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: split_text
  labels:
    automacene.org/category: text
    automacene.org/skill: split
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Text Split
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: Split a string on a delimiter.
  runtime: python:3.11
  handler: split_text:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: text
    type: string
    description: The string to split.
    required: true
  - name: delimiter
    type: string
    description: What to split on.
    required: true
  output:
  - name: parts
    type: array
    description: The pieces, in order.
  examples:
  - input:
      text: a,b,c
      delimiter: ','
    output:
      parts:
      - a
      - b
      - c
