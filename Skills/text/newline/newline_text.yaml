apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: newline_text
  labels:
    automacene.org/category: text
    automacene.org/skill: newline
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Newline
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: A newline character, for building text.
  runtime: python:3.11
  handler: newline_text:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs: []
  output:
  - name: text
    type: string
    description: A newline.
  examples:
  - input: {}
    output:
      text: '

        '
