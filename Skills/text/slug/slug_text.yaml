apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: slug_text
  labels:
    automacene.org/category: text
    automacene.org/skill: slug
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Text Slug
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: 'Make a URL-safe slug: lowercase, with each run of other characters turned into -.'
  runtime: python:3.11
  handler: slug_text:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: text
    type: string
    description: The string to slug.
    required: true
  output:
  - name: slug
    type: string
    description: The slug.
  examples:
  - input:
      text: Hello, World
    output:
      slug: hello-world
