apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: stringify_text
  labels:
    automacene.org/category: text
    automacene.org/skill: stringify
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: To String
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: Turn any value into a string; null becomes the empty string.
  runtime: python:3.11
  handler: stringify_text:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: value
    type: object
    description: The value, of any type.
  output:
  - name: text
    type: string
    description: The value as a string.
  examples:
  - input:
      value: 12
    output:
      text: '12'
  - input: {}
    output:
      text: ''
