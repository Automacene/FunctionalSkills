apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: concat_text
  labels:
    automacene.org/category: text
    automacene.org/skill: concat
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Text Concatenation
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: Join values into one string, skipping nulls.
  runtime: python:3.11
  handler: concat_text:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: values
    type: array
    description: The values to join; each is turned into a string.
    required: true
  - name: separator
    type: string
    description: Put between values.
    default: ''
  output:
  - name: text
    type: string
    description: The joined string.
  examples:
  - input:
      values:
      - a
      - 1
      - null
      - b
    output:
      text: a1b
  - input:
      values:
      - a
      - b
      separator: ', '
    output:
      text: a, b
