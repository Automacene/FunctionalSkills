apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: sanitize_text
  labels:
    automacene.org/category: text
    automacene.org/skill: sanitize
    automacene.org/version: 1.0.0
  annotations:
    automacene.org/title: Text Sanitize
    automacene.org/authors: Codie Petersen <codie@asteres-technologies.com>
spec:
  description: Remove every character matching a pattern (by default anything but letters, digits, _, space and -).
  runtime: python:3.11
  handler: sanitize_text:handler
  minReplicas: 1
  maxReplicas: 1
  triggers:
    http:
      kind: http
      maxWorkers: 4

  # The contract: the JSON body's keys and the JSON reply's. Nuclio has no field for it and ignores these.
  inputs:
  - name: text
    type: string
    description: The string to clean.
    required: true
  - name: pattern
    type: string
    description: A regular expression of what to remove.
    default: '[^a-zA-Z0-9_ -]'
  - name: replacement
    type: string
    description: What to put in place of each match.
    default: ''
  output:
  - name: text
    type: string
    description: The cleaned string.
  examples:
  - input:
      text: héllo, wörld!
    output:
      text: hllo wrld
